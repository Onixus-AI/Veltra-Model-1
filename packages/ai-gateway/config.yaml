model_list:
  # Zero-cost general-purpose routing for utility tasks and classification
  - model_name: veltra-free
    litellm_params:
      model: openrouter/openrouter/free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Free high-speed agent and triage model
  - model_name: veltra-fast-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Free coding and structural data extraction model
  - model_name: veltra-code-free
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Complex logic, deep reasoning, and code
  - model_name: veltra-logic
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0.2

  # Fast text, email triage, and CRM actions
  - model_name: veltra-fast
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0.3

  # Agentic workflow execution and tool calling
  - model_name: veltra-agent
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-super-vl
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Explicit provider choices exposed in the Chat selector
  - model_name: veltra-mimo
    litellm_params:
      model: openrouter/xiaomi/mimo-v2.6-flash
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: veltra-ling
    litellm_params:
      model: openrouter/inclusionai/ling-3.0-flash
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Image understanding for chat attachments (requires image_url content parts)
  - model_name: veltra-vision
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-super-vl
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Free development and local test tier
  - model_name: veltra-dev
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

# Media models use OpenRouter's dedicated APIs, not text chat completions.
# Provider estimates are USD before markup. Verify live pricing before charging.
image_generation:
  default_model: recraft/recraft-v4.1-flash
  api_base: https://openrouter.ai/api/v1
  models:
    - id: recraft/recraft-v4.1-flash
      name: Recraft V4.1 Flash
      estimated_usd_per_image: 0.007
      supports_resolution: false
    - id: black-forest-labs/flux.2-klein-4b
      name: FLUX.2 Klein 4B
      estimated_usd_per_image: 0.014
      pricing_note: First output megapixel; additional megapixels cost extra.
      supports_resolution: false
    - id: bytedance-seed/seedream-5-0-flash
      name: Seedream 5.0 Flash
      estimated_usd_per_image: 0.018
      supports_resolution: true
    - id: qwen/qwen-image-3
      name: Qwen Image 3
      estimated_usd_per_image: 0.03
      supports_resolution: true
video_generation:
  api_base: https://openrouter.ai/api/v1
  models:
    - id: bytedance/seedance-2.0-mini
      name: Seedance 2.0 Mini
      estimated_usd_per_second_from: 0.03363
      pricing_note: Starting estimate at 480p; resolution and references affect price.
    - id: kwaivgi/kling-v3.0-std
      name: Kling 3.0 Standard
      estimated_usd_per_second_without_audio: 0.084
      estimated_usd_per_second_with_audio: 0.126


# Bounded coding-team roles. Provider IDs can be overridden by server env vars.
coding_team:
  planner: nvidia/nemotron-3-ultra-550b-a55b
  coder: nvidia/nemotron-3.5-super-vl
  reviewer: nvidia/nemotron-3.5-super-vl
  vision: nvidia/nemotron-3.5-super-vl
  design: nvidia/nemotron-3.5-super-vl

# Ordered OpenRouter fallbacks. Never route normal customer data to :free trials.
chat_fallbacks:
  veltra-fast: [qwen/qwen-2.5-coder-32b-instruct, google/gemini-2.5-flash]
  veltra-logic: [deepseek/deepseek-chat, google/gemini-2.5-flash]
  veltra-agent: [xiaomi/mimo-v2.6-flash, google/gemini-2.5-flash, inclusionai/ling-3.0-flash, deepseek/deepseek-chat]
  veltra-vision: [qwen/qwen2.5-vl-72b-instruct]

coding_fallbacks:
  planner: [deepseek/deepseek-chat]
  coder: [qwen/qwen-2.5-coder-32b-instruct]
  reviewer: [deepseek/deepseek-chat]
  vision: [qwen/qwen3-vl-235b-a22b-instruct]
  design: [qwen/qwen3.7-plus]
