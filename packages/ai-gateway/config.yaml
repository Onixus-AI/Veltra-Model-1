model_list:
  # Zero-cost general-purpose routing for utility tasks and classification
  - model_name: veltra-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Free high-speed agent and triage model
  - model_name: veltra-fast-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Free coding and structural data extraction model
  - model_name: veltra-code-free
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Complex logic, deep reasoning, and code
  - model_name: veltra-logic
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro-0813
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0.2

  # Fast text, email triage, and CRM actions
  - model_name: veltra-fast
    litellm_params:
      model: openrouter/z-ai/glm-5.3
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0.3

  # Agentic workflow execution and tool calling
  - model_name: veltra-agent
    litellm_params:
      model: openrouter/moonshotai/kimi-k3.1-pro
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Explicit provider choices exposed in the Chat selector
  - model_name: veltra-mimo
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: veltra-ling
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Image understanding for chat attachments (requires image_url content parts)
  - model_name: veltra-vision
    litellm_params:
      model: openrouter/moonshotai/kimi-k3.1-pro
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # Free development and local test tier
  - model_name: veltra-dev
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

# Media models use OpenRouter's dedicated APIs, not text chat completions.
# Provider estimates are USD before markup. Verify live pricing before charging.
image_generation:
  default_model: recraft/recraft-v4.1-flash
  api_base: https://openrouter.ai/api/v1
  models:
    - id: recraft/recraft-v4.1-flash
      name: Recraft V4.1 Flash
      estimated_usd_per_image: 0.007
      supports_resolution: false
    - id: bytedance-seed/seedream-5-0-flash
      name: Seedream 5.0 Flash
      estimated_usd_per_image: 0.018
      supports_resolution: true
# No video route is enabled until a separate per-video budget is verified.
video_generation:
  models: []

coding_team:
  planner: nvidia/nemotron-3-ultra-550b-a55b:free
  coder: cohere/north-mini-code:free
  reviewer: nvidia/nemotron-3-ultra-550b-a55b:free
  vision: nvidia/nemotron-3.5-super-vl:free
  design: nvidia/nemotron-3.5-super-vl:free

# Chat routes (model-policy chat_routes) use capable paid models in this order and
# end with a low-cost model already on the OpenRouter guardrail allowlist.
# Every other route starts free; only approved cheap models can follow.
chat_fallbacks:
  veltra-free: [inclusionai/ling-3.0-flash, xiaomi/mimo-v2.6-flash]
  veltra-fast-free: [inclusionai/ling-3.0-flash, nvidia/nemotron-3.5-lightning]
  veltra-code-free: [inception/mercury-3, qwen/qwen3.8-flash]
  veltra-dev: [inclusionai/ling-3.0-flash, qwen/qwen3.8-flash]
  veltra-fast: [deepseek/deepseek-v4-pro-0813, minimax/minimax-m3.1-flash]
  veltra-logic: [z-ai/glm-5.3, minimax/minimax-m3.1-flash]
  veltra-agent: [z-ai/glm-5.3, xiaomi/mimo-v2.6-flash]
  veltra-vision: [minimax/minimax-m3, inclusionai/ling-3.0-flash-vl]
  veltra-mimo: [inclusionai/ling-3.0-flash, xiaomi/mimo-v2.6-flash]
  veltra-ling: [inclusionai/ling-3.0-flash, xiaomi/mimo-v2.6-flash]

coding_fallbacks:
  planner: [minimax/minimax-m3.1-flash, deepseek/deepseek-v4.1-flash-1017]
  coder: [inception/mercury-3, qwen/qwen3.8-flash]
  reviewer: [xiaomi/mimo-v2.6-flash, qwen/qwen3.8-flash]
  vision: [inclusionai/ling-3.0-flash-vl, nvidia/nemotron-3.5-super-vl]
  design: [inclusionai/ling-3.0-flash-vl, nvidia/nemotron-3.5-super-vl]
