name: Revenue system verification
on: [pull_request, workflow_dispatch]
jobs:
  revenue:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only-password
      PGOPTIONS: -c client_min_messages=warning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply the revenue migrations to a disposable database
        run: |
          psql -d postgres -c "create database rev"
          for f in supabase/tests/revenue-bootstrap.sql supabase/migrations/20261025090000_revenue_core_records.sql supabase/migrations/20261025090100_revenue_mail_automation.sql supabase/migrations/20261025090200_revenue_journey.sql supabase/migrations/20261025120000_revenue_live_relay.sql supabase/migrations/20261026030000_crm_prospect_scores.sql supabase/migrations/20261026120000_revenue_reply_threading.sql; do
            psql -v ON_ERROR_STOP=1 -q -d rev -f "$f"
          done
      - name: Re-apply the migrations to prove they are re-runnable
        run: |
          for f in supabase/migrations/20261025090000_revenue_core_records.sql supabase/migrations/20261025090100_revenue_mail_automation.sql supabase/migrations/20261025090200_revenue_journey.sql supabase/migrations/20261025120000_revenue_live_relay.sql supabase/migrations/20261026030000_crm_prospect_scores.sql supabase/migrations/20261026120000_revenue_reply_threading.sql; do
            psql -v ON_ERROR_STOP=1 -q -d rev -f "$f"
          done
      - name: Tenant isolation, grants and direct-write denial
        run: psql -v ON_ERROR_STOP=1 -q -d rev -f supabase/tests/revenue-isolation.sql
      - name: Prospect scores (evidence, tiers, tenant isolation)
        run: psql -v ON_ERROR_STOP=1 -q -d rev -f supabase/tests/prospect-scores.sql
      - name: Reply threading (Message-ID columns, sanitizing, workspace isolation, send lease)
        run: psql -v ON_ERROR_STOP=1 -q -d rev -f supabase/tests/revenue-threading.sql
      - run: npm ci
        working-directory: apps/web
      - name: End-to-end acceptance and negative tests (fake Gmail, locally signed Stripe events)
        working-directory: apps/web
        env:
          REVENUE_TEST_DATABASE_URL: postgres://postgres:fixture-only-password@127.0.0.1:5432/rev
        run: npx tsx --test --test-concurrency=1 test/revenue-e2e/acceptance.test.ts
      - name: Install PostgREST for the HTTP route and Chat wiring tests
        run: |
          curl -fsSL -o /tmp/postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  /tmp/postgrest.tar.xz" | sha256sum -c -
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
      - name: HTTP route tests and Chat wiring tests (real PostgREST, local auth check, fake model gateway)
        working-directory: apps/web
        env:
          REVENUE_TEST_DATABASE_URL: postgres://postgres:fixture-only-password@127.0.0.1:5432/rev
          REVENUE_TEST_POSTGREST_BIN: /tmp/postgrest
        run: npx tsx --test --test-concurrency=1 test/revenue-e2e/routes.test.ts test/revenue-e2e/chat.test.ts
