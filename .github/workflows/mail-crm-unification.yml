name: Mail and CRM unification database checks
on: [pull_request, workflow_dispatch]
jobs:
  mail-crm:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Stub schema, apply the migration, run behaviour checks
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/mail-crm-unification-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261125020000_mail_crm_unification.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/mail-crm-unification.sql
